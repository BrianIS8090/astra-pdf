[package]
name = "astra-pdf"
version = "1.0.0-rc.6"
edition = "2021"
description = "Нативный просмотрщик PDF для Windows"
license = "MIT"

[dependencies]
libloading = "0.8.9"
lopdf = { version = "0.45.0", default-features = false }
png = "0.17.16"
sha2 = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10.1"
zeroize = "1.8"
flate2 = "1.1"
skrifa = { version = "0.47", default-features = false, features = ["std"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading",
  "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_Storage_Xps", "Win32_Storage_FileSystem"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
