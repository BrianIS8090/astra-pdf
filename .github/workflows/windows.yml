name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка и тесты Rust
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Получить исходники
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Установить закреплённые инструменты
        run: .\scripts\setup.ps1
      - name: Проверить форматирование и код
        run: |
          $env:CARGO_HOME = Join-Path $PWD 'tools\cargo'
          $env:RUSTUP_HOME = Join-Path $PWD 'tools\rustup'
          $env:PATH = "$PWD\tools\cargo\bin;$PWD\tools\w64devkit\bin;$env:PATH"
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Выполнить тесты и собрать приложение
        run: .\scripts\build.ps1 -Test -Release
      - name: Подготовить установщик
        run: |
          .\scripts\setup-installer.ps1
          .\scripts\assemble.ps1 -Destination .\dist\installer-payload
          .\scripts\build-installer.ps1 -PayloadDirectory .\dist\installer-payload -TestIdentity
      - name: Проверить установку, восстановление и удаление
        run: |
          $version = (Get-Content .\dist\installer-payload\version.json -Raw | ConvertFrom-Json).version
          .\scripts\test-installer.ps1 -Installer ".\dist\installer\AstraPDF-$version-setup-test-x64.exe" -PayloadDirectory .\dist\installer-payload
      - name: Собрать установщик выпуска
        run: .\scripts\build-installer.ps1 -PayloadDirectory .\dist\installer-payload
